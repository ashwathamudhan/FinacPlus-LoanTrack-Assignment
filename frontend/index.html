
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoanTrack | Loan Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>LoanTrack</h1>
            <p>Simple Loan Management Dashboard</p>
        </header>

        <section class="card">
            <h2>Add New Loan</h2>

            <form id="loanForm">
                <label for="borrower_name">Borrower Name</label>
                <input
                    type="text"
                    id="borrower_name"
                    required
                    maxlength="100"
                >

                <label for="loan_amount">Loan Amount (INR)</label>
                <input
                    type="number"
                    id="loan_amount"
                    min="0.01"
                    step="0.01"
                    required
                >

                <label for="property_city">Property City</label>
                <input
                    type="text"
                    id="property_city"
                    required
                    maxlength="100"
                >

                <button type="submit">Add Loan</button>
            </form>

            <p id="message" role="status"></p>
        </section>

        <section class="card">
            <div class="section-heading">
                <h2>Existing Loans</h2>
                <button id="refreshBtn" type="button">
                    Refresh
                </button>
            </div>

            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Borrower</th>
                            <th>Amount</th>
                            <th>City</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="loansTable">
                        <tr>
                            <td colspan="5">Loading loans...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
